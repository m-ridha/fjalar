product: android/app

dependencies:
  - $libs.koin.android
  - $libs.koin.compose.viewmodel
  - //shared
  - $libs.androidx.activity.compose
  - $libs.androidx.window
  - $libs.androidx.core.splashscreen

settings:
  compose: enabled
  android:
    namespace: com.muhammadridha.fjalar
    applicationId: com.muhammadridha.fjalar
    abiFilters:
      - arm64-v8a
    resourcePackaging:
      excludes:
        - DebugProbesKt.bin
        - META-INF/*.version
        - META-INF/androidx/**/LICENSE.txt
        - META-INF/org/**/LICENSE.txt
        - META-INF/com/android/build/gradle/app-metadata.properties
        - META-INF/version-control-info.textproto
        - META-INF/*.kotlin_module

test-dependencies:
  - $libs.kotlinx.coroutines.test
