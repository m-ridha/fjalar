name: CodeQL

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
            runner: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21 (java-kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK and packages (java-kotlin)
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Cache Kotlin Toolchain, Konan & Dependencies (java-kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-${{ hashFiles('**/module.yaml', 'libs.versions.toml', 'kotlin') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Android & Shared Kotlin (java-kotlin)
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x ./kotlin
          ./kotlin build -m androidApp -p android -v debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
