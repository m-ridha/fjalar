name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Multiplatform Builds & Tests
    # Avoid running expensive macOS runners on draft pull requests until marked ready for review
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR Title Format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          echo "PR Title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore)\([a-zA-Z0-9_-]+\):\ .+ ]]; then
            echo "::warning title=Conventional Commit Format::PR title does not strictly follow '<type>(<scope>): <subject>' as documented in AGENTS.md"
          else
            echo "PR title adheres to convention."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Select Xcode 16
        shell: bash
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_16" ]; then
            echo "Selecting $XCODE_16"
            sudo xcode-select -s "$XCODE_16"
          elif [ -d "/Applications/Xcode.app" ]; then
            echo "Selecting /Applications/Xcode.app"
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Cache Kotlin Toolchain, Konan & Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.konan
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-kotlin-${{ hashFiles('**/module.yaml', 'libs.versions.toml', 'kotlin') }}
          restore-keys: |
            ${{ runner.os }}-kotlin-

      - name: Grant execute permission for Kotlin CLI runner
        run: chmod +x ./kotlin

      - name: Run Unit Tests (./kotlin test)
        run: ./kotlin test

      - name: Run Multiplatform Checks (./kotlin check)
        run: ./kotlin check

      - name: Upload Test & Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/reports/
            build/logs/
          retention-days: 7
