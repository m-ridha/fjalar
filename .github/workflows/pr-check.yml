name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Multiplatform Builds & Tests
    # Avoid running expensive macOS runners on draft pull requests until marked ready for review
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Kotlin/Native 2.4.20 uses Apple platform libraries from the Xcode 26.4 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR Title Format
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          # Titles are untrusted log data, including legacy ##[...] commands.
          # Disable runner command interpretation only while printing that data.
          command_token=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          printf '::stop-commands::%s\n' "$command_token"
          printf 'PR Title: %s\n' "$PR_TITLE"
          printf '::%s::\n' "$command_token"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore)\([a-zA-Z0-9_-]+\):\ .+ ]]; then
            echo "::warning title=Conventional Commit Format::PR title does not strictly follow '<type>(<scope>): <subject>' as documented in AGENTS.md"
          else
            echo "PR title adheres to convention."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify selected Xcode and simulator SDK
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Cache Kotlin Toolchain, Konan & Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.konan
            ~/Library/Caches/JetBrains/Kotlin/cli
            ~/.m2/repository
          key: ${{ runner.os }}-xcode26.4-kotlin-${{ hashFiles('**/module.yaml', 'libs.versions.toml', 'kotlin') }}
          restore-keys: |
            ${{ runner.os }}-xcode26.4-kotlin-

      - name: Grant execute permission for Kotlin CLI runner
        run: chmod +x ./kotlin

      - name: Run Unit Tests (./kotlin test)
        run: ./kotlin test

      - name: Test Security Boundaries
        run: |
          python3 scripts/test_workflow_command_safety.py
          python3 scripts/test_android_alarm_security.py

      - name: Test Release Version Handling
        run: |
          python3 scripts/test_release_metadata.py
          python3 scripts/test_upload_release_assets.py

      - name: Verify String Catalogs, Icons & Audio Assets
        run: |
          python3 scripts/test_string_catalogs.py
          python3 scripts/test_generated_icons.py
          python3 scripts/test_generated_audio.py

      - name: Run Multiplatform Checks (./kotlin check)
        run: ./kotlin check

      - name: Upload Test & Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/reports/
            build/logs/
          retention-days: 7
